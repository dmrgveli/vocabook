<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vocabook has moved</title>
  <link rel="canonical" href="https://vocabook.online/">
  <script>
    // Keep the page the link pointed at: #/word/thrive opens the same word on the new address.
    location.replace('https://vocabook.online/' + location.hash)
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fbf8f3; color: #1b1a1f;
      font: 17px/1.5 system-ui, sans-serif; padding: 16px; box-sizing: border-box; }
    a { color: inherit; font-weight: 700; text-decoration-color: #ffd84d; text-decoration-thickness: 4px; }
    @media (prefers-color-scheme: dark) { body { background: #161519; color: #f2efe9; } }
  </style>
</head>
<body>
  <p>Vocabook has moved to <a href="https://vocabook.online/">vocabook.online</a>.</p>
</body>
</html>
